- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/Brewfile: Brewfile
    ~/.zsh.after: zsh.after
    ~/bin: bin
    # force: replace an existing regular file (back it up first; see CLAUDE.md)
    ~/.gitconfig:
      path: gitconfig
      force: true
    ~/.zshrc:
      path: zshrc
      force: true
    ~/.zshenv:
      path: zshenv
      force: true
    ~/.config/git/ignore:
      create: true
      path: gitignore_global
      force: true
    ~/.config/nvim:
      create: true
      path: config/nvim
    ~/.tmux.conf: tmux.conf
    ~/.gitattributes: .gitattributes

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - [brew bundle install]
  - [npm install -g typescript pyright]
  - [go install golang.org/x/tools/gopls@latest]
